<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GroceryGo - My Profile</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        .profile-page {
            padding: 40px 7%;
            min-height: 80vh;
            max-width: 900px;
            margin: 0 auto;
        }

        .profile-card {
            background: white;
            border: 1px solid #e8eee9;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            margin-bottom: 24px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid #f0f4f1;
            padding-bottom: 24px;
            margin-bottom: 24px;
        }

        .profile-avatar {
            width: 72px;
            height: 72px;
            background: #e9f8ef;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            color: #19a463;
        }

        .profile-meta h1 {
            font-size: 24px;
            color: #1a2a1e;
            margin-bottom: 4px;
        }

        .profile-meta p {
            color: #666;
            font-size: 14px;
        }

        .role-pill {
            display: inline-block;
            background: #e6f6ed;
            color: #148550;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 6px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .info-item {
            background: #fbfdfc;
            border: 1px solid #eef4f0;
            border-radius: 10px;
            padding: 16px;
        }

        .info-item small {
            display: block;
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info-item strong {
            font-size: 15px;
            color: #222;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #f7faf8;
            border: 1px solid #e5ede7;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
        }

        .stat-card .num {
            font-size: 26px;
            font-weight: 800;
            color: #19a463;
            margin-bottom: 4px;
        }

        .stat-card .label {
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }

        .profile-actions {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        @media (max-width: 650px) {
            .info-grid,
            .stats-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<header class="navbar">
    <div class="logo">
        🛒 <span>GroceryGo</span>
    </div>

    <div class="nav-actions">
        <a href="dashboard.html" class="login-link">Shop</a>
        <a href="orders.html" class="login-link">My Orders</a>
        <a href="cart.html" class="cart-button">
            🛒 Cart
            <span id="cartCount">0</span>
        </a>
        <a href="profile.html" class="login-link" style="color:#19a463;font-weight:bold;">👤 Profile</a>
        <button type="button" onclick="logout()" class="register-link" style="border:none;background:none;cursor:pointer;">
            Logout
        </button>
    </div>
</header>

<main class="profile-page">

    <div class="profile-card">
        <div class="profile-header">
            <div class="profile-avatar">👤</div>
            <div class="profile-meta">
                <h1 id="profileName">User Name</h1>
                <p id="profileEmail">user@example.com</p>
                <span class="role-pill" id="profileRole">Customer Account</span>
            </div>
        </div>

        <h3 style="font-size:16px;margin-bottom:14px;color:#333;">Account Details</h3>
        <div class="info-grid">
            <div class="info-item">
                <small>Full Name</small>
                <strong id="detailName">-</strong>
            </div>

            <div class="info-item">
                <small>Email Address</small>
                <strong id="detailEmail">-</strong>
            </div>

            <div class="info-item">
                <small>User ID</small>
                <strong id="detailId">-</strong>
            </div>

            <div class="info-item">
                <small>Primary Delivery City</small>
                <strong>Vijayawada</strong>
            </div>
        </div>

        <h3 style="font-size:16px;margin-bottom:14px;color:#333;">Activity Overview</h3>
        <div class="stats-row">
            <div class="stat-card">
                <div class="num" id="statTotalOrders">0</div>
                <div class="label">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statActiveOrders" style="color:#d97706;">0</div>
                <div class="label">In Progress</div>
            </div>
            <div class="stat-card">
                <div class="num" id="statDeliveredOrders" style="color:#148550;">0</div>
                <div class="label">Delivered</div>
            </div>
        </div>

        <div class="profile-actions">
            <a href="orders.html" class="primary-btn" style="text-decoration:none;padding:12px 22px;">
                📦 View My Orders
            </a>
            <a href="dashboard.html" class="secondary-btn" style="text-decoration:none;padding:12px 22px;">
                Shop Groceries
            </a>
            <button onclick="logout()" class="secondary-btn" style="border-color:#d9534f;color:#d9534f;cursor:pointer;padding:12px 22px;">
                Logout from Account
            </button>
        </div>
    </div>

</main>

<!-- SCRIPTS -->
<script src="../store.js"></script>
<script src="../auth.js"></script>

<script>
(function() {
    const user = window.GroceryAuth.protectPage("user");
    if (!user) return;

    // Populate user profile info
    document.getElementById("profileName").textContent = user.name;
    document.getElementById("profileEmail").textContent = user.email;
    document.getElementById("detailName").textContent = user.name;
    document.getElementById("detailEmail").textContent = user.email;
    document.getElementById("detailId").textContent = user.id || "N/A";
    document.getElementById("profileRole").textContent = user.role.toUpperCase() + " ACCOUNT";

    // Navbar cart count
    document.getElementById("cartCount").textContent = window.GroceryStore.getCartCount();

    // Order metrics for this user
    const orders = window.GroceryStore.getOrders().filter(o => o.userId === user.id);
    const totalCount = orders.length;
    const deliveredCount = orders.filter(o => o.status === "Delivered").length;
    const activeCount = orders.filter(o => !["Delivered", "Cancelled"].includes(o.status)).length;

    document.getElementById("statTotalOrders").textContent = totalCount;
    document.getElementById("statActiveOrders").textContent = activeCount;
    document.getElementById("statDeliveredOrders").textContent = deliveredCount;
})();
</script>

</body>
</html>
